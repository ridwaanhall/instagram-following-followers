{% extends 'base.html' %}

{% block title %}500 - {{ site_name }}{% endblock %}
{% block meta_robots %}noindex, follow{% endblock %}

{% block content %}
<div class="wrap py-20 sm:py-28">
    <p class="figure font-serif text-[96px] text-ink-3 sm:text-[160px]">500</p>
    <h1 class="h2 mt-8">Something broke on our side</h1>
    <p class="lede mt-4">Nothing you uploaded was kept. Please try again in a moment.</p>
    <div class="mt-10 flex flex-wrap gap-3">
        <a href="{% url 'home' %}" class="btn">{{ ui_back_home }}</a>
        <button type="button" class="btn-text" onclick="window.location.reload()">{% include "partials/icon.html" with name="refresh" %}{{ ui_try_again }}</button>
    </div>
</div>
{% endblock %}
