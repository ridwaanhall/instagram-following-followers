<div class="form-error mt-6" role="alert" tabindex="-1" data-form-error hidden>
    <span class="mt-0.5 shrink-0 text-accent">{% include "partials/icon.html" with name="alert" %}</span>
    <div class="min-w-0">
        <p class="font-medium text-ink">{{ ui_err_title }}</p>
        <ul class="mt-1 space-y-0.5 text-ink-2" data-form-error-list></ul>
    </div>
</div>
<div class="mt-6 flex flex-col-reverse gap-4 sm:flex-row sm:items-center sm:justify-between">
    <p class="caption inline-flex items-center gap-2">{% include "partials/icon.html" with name="lock" cls="size-3.5" %}{{ ui_stored_note }}</p>
    <button type="submit" class="btn-accent self-start sm:self-auto" data-submit data-busy-label="{{ ui_analyzing }}">
        <span data-label>{{ label }}</span>
        <span data-icon>{% include "partials/icon.html" with name="arrow-right" %}</span>
    </button>
</div>
